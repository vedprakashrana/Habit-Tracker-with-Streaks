version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: habitflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: habitflow
    ports:
      - "5432:5432"
    volumes:
      - habitflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  habitflow_pgdata:
